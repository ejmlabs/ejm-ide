[[permission]]
identifier = "workspace"
description = "Open and edit files in the selected workspace."
commands.allow = ["host_subscribe", "host_confirm_close", "host_cancel_close", "workspace_open", "workspace_current", "workspace_entries", "workspace_read", "workspace_save", "workspace_create", "workspace_search", "workspace_changes", "workspace_diff", "git_status", "git_refs", "git_history", "git_commit_detail", "git_diff", "git_compare", "git_blame", "git_stage", "git_unstage", "git_commit"]

[[permission]]
identifier = "language"
description = "Use language intelligence for workspace documents."
commands.allow = ["language_open", "language_change", "language_save", "language_request", "language_cancel", "language_close"]

[[permission]]
identifier = "quality"
description = "Format and lint workspace documents with fixed host tools."
commands.allow = ["quality_format", "quality_lint"]

[[permission]]
identifier = "external-links"
description = "Open a clicked web or mail link through the authenticated main interface."
commands.allow = ["host_open_external"]

[[permission]]
identifier = "index"
description = "Search saved workspace source and record versioned language-server links locally."
commands.allow = ["index_status", "index_refresh", "index_search", "index_neighbors", "index_traverse", "index_symbol_at", "index_source_versions", "index_record_graph"]

[[permission]]
identifier = "terminal"
description = "Run user-requested commands in the workspace."
commands.allow = ["terminal_run"]

[[permission]]
identifier = "agent"
description = "Configure providers and control ejm-harness in ejm-ide."
commands.allow = ["provider_list", "provider_save", "provider_remove", "agent_connect", "agent_send", "agent_cancel", "agent_ide_ack", "agent_new_chat", "agent_list_chats", "agent_open_chat", "agent_chat_turns", "agent_rename_chat", "agent_archive_chat", "agent_complete", "agent_complete_cancel", "harness_snapshot", "harness_clear", "harness_event_detail", "harness_diagnostics"]

[[permission]]
identifier = "extensions"
description = "Manage reviewed local ejm-ide extensions."
commands.allow = ["extensions_list", "extensions_scaffold", "extensions_build", "extensions_panel", "extensions_activate", "extensions_disable", "extensions_revert", "extensions_mount", "extensions_unmount"]
