[package]
name = "ejm-ide"
version = "0.1.0"
description = "A coding IDE built on the shared ejm-harness"
license = "MIT"
repository = "https://github.com/ejmlabs/ejm-ide"
homepage = "https://ide.ejmlabs.com"
readme = "../README.md"
publish = false
edition = "2024"

[lib]
name = "ejm_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aho-corasick = "1.1"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
cap-std = "3"
ejm-harness = { path = "../../ejm-harness/crates/ejm-harness" }
ejm-harness-auth = { path = "../../ejm-harness/crates/ejm-harness-auth" }
eventsource-stream = "0.2.3"
futures-util = "0.3"
libc = "0.2"
ignore = "0.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.23.6"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
cap-fs-ext = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
