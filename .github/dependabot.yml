version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # The ejmlabs/.github caller pins move only by hand, with every pin in pr.yml and release.yml in one pull request.
      - dependency-name: "ejmlabs/.github"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: [minor, patch]
