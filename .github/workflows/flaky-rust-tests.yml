name: IDE test reliability
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * *'
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  frontend:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: work/ejm-ide
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install frontend dependencies
        id: dependencies
        working-directory: work/ejm-ide
        run: npm ci --ignore-scripts
      - name: Test the frontend detector
        working-directory: work/ejm-ide
        run: python3 -B -m unittest discover -s scripts -p 'test_frontend_flake_check.py'
      - name: Compare frontend test runs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: work/ejm-ide
        run: python3 -B scripts/frontend_flake_check.py "$RUNNER_TEMP/ide-frontend-flakes"
      - name: Preserve frontend reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ide-frontend-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ide-frontend-flakes
          if-no-files-found: warn
          retention-days: 7
  native:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: work/ejm-ide
          persist-credentials: false
      - name: Read reviewed harness revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '\n' < work/ejm-ide/.github/harness-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "harness=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ejmlabs/ejm-harness
          ref: ${{ steps.revision.outputs.harness }}
          path: work/ejm-harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rust-analyzer && rustup default 1.99.1
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83
        with:
          ruby-version: '3.4.11'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: false
      - name: Install language servers
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/work/ejm-ide/.github/ruby-lsp.Gemfile"
          export BUNDLE_FROZEN=true
          bundle install
          echo "BUNDLE_GEMFILE=$BUNDLE_GEMFILE" >> "$GITHUB_ENV"
          echo 'BUNDLE_FROZEN=true' >> "$GITHUB_ENV"
          echo 'RUBYOPT=-rbundler/setup' >> "$GITHUB_ENV"
          echo "$(ruby -e 'puts Gem.bindir')" >> "$GITHUB_PATH"
          export GOBIN="$RUNNER_TEMP/language-server-bin"
          go install golang.org/x/tools/gopls@v0.23.0
          echo "$GOBIN" >> "$GITHUB_PATH"
          rust-analyzer --version
          bundle exec ruby-lsp --version
          "$GOBIN/gopls" version
      - name: Install verified cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          bindir="$RUNNER_TEMP/nextest-bin"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.124/cargo-nextest-0.9.124-universal-apple-darwin.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 7fa40a74fbad476859211759528186252da77d6872bdb67b06a709152bd0a20c "$archive" | shasum -a 256 --check --status
          mkdir "$bindir"
          tar -xzf "$archive" -C "$bindir" cargo-nextest
          "$bindir/cargo-nextest" --version
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Install native bundle resources
        id: resources
        working-directory: work/ejm-ide
        run: npm ci --ignore-scripts
      - name: Test the detector
        working-directory: work/ejm-ide
        run: python3 -B -m unittest discover -s scripts -p 'test_flake_check.py'
      - name: Compare native Rust test runs
        if: ${{ !cancelled() && steps.resources.outcome == 'success' }}
        timeout-minutes: 120
        working-directory: work/ejm-ide/src-tauri
        run: python3 ../scripts/flake_check.py "$RUNNER_TEMP/ide-rust-flakes"
      - name: Preserve native reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ide-native-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ide-rust-flakes
          if-no-files-found: warn
          retention-days: 7
