name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: ejm-ide
    steps:
      - name: Check out ejm-ide
        uses: actions/checkout@v4
        with:
          path: ejm-ide
      - name: Check out ejm-harness
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.EJM_HARNESS_REPOSITORY || format('{0}/ejm-harness', github.repository_owner) }}
          ref: ${{ vars.EJM_HARNESS_REF }}
          token: ${{ secrets.EJM_HARNESS_TOKEN || github.token }}
          path: ejm-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ejm-ide/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ejm-ide/src-tauri -> target
      - run: npm ci
      - run: npm run verify
      - run: npm run site:check
      - run: npm run site:build
